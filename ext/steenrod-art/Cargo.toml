[package]
name = "steenrod-art"
version = "0.2.0"
edition = "2021"
description = "Cell diagram compiler for Steenrod modules — anti-aliased bitmap rendering"

[lib]
name = "steenrod_art"
path = "src/lib.rs"

[[bin]]
name = "steenrod-art"
path = "src/main.rs"

[dependencies]
tiny-skia = "0.11"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
